<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spec Checker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root { --bg:#fff; --fg:#1f2937; --muted:#6b7280; --line:#e5e7eb; --ok:#16a34a; --bad:#dc2626; --brand:#2563eb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111827; --fg:#f3f4f6; --muted:#9ca3af; --line:#374151; } }
  * { box-sizing:border-box; }
  body { margin:0; font:13px/1.45 system-ui,sans-serif; background:var(--bg); color:var(--fg); }
  .wrap { padding:10px; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  h1 { font-size:14px; margin:0; }
  button, select { font:inherit; padding:6px 10px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); cursor:pointer; }
  button.primary { background:var(--brand); color:#fff; border-color:var(--brand); }
  button:disabled { opacity:.5; cursor:default; }
  .tabs { display:flex; gap:4px; margin-bottom:8px; }
  .tabs button.active { background:var(--brand); color:#fff; border-color:var(--brand); }
  .bar { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:8px; }
  .drop { border:2px dashed var(--line); border-radius:8px; padding:12px; text-align:center; color:var(--muted); margin-bottom:8px; }
  .drop.over { border-color:var(--brand); }
  table { width:100%; border-collapse:collapse; }
  td, th { padding:5px 4px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle; }
  img.th, canvas.th { width:40px; height:40px; object-fit:cover; border-radius:4px; display:block; }
  .ok { color:var(--ok); font-weight:600; } .bad { color:var(--bad); font-weight:600; }
  .muted { color:var(--muted); }
  textarea, input[type=text] { width:100%; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); font:inherit; }
  .counter { margin:4px 0 10px; }
  details { margin-bottom:8px; }
  summary { cursor:pointer; color:var(--brand); }
  body.expanded .wrap { position:fixed; inset:0; z-index:99; background:var(--bg); overflow:auto; padding:20px 28px; }
  body.expanded img.th, body.expanded canvas.th { width:72px; height:72px; }
  .summary { margin:8px 0; padding:8px; border-radius:6px; background:var(--line); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📐 Spec Checker</h1>
    <div>
      <button id="btnExpand">⤢ Mở rộng</button>
      <button id="btnPopout" title="Mở cửa sổ mới">↗</button>
    </div>
  </header>

  <div class="tabs">
    <button class="active" data-tab="img">Ảnh / Dimension</button>
    <button data-tab="txt">Ký tự</button>
  </div>

  <section id="tab-img">
    <div class="bar">
      <select id="mode">
        <option value="auto">Tự nhận diện</option>
        <option value="logo">App logo (vuông, ≥512×512)</option>
        <option value="ios">iOS screenshot (2–8 ảnh)</option>
        <option value="feature">Android feature graphic 1024×500</option>
        <option value="phone">Android phone 1080×1920 (2–8 ảnh)</option>
      </select>
      <button id="btnZip" class="primary">📦 Tải tất cả (.zip)</button>
      <button id="btnClear">Xoá hết</button>
    </div>

    <div class="drop" id="drop">
      Kéo ảnh từ khung chat vào đây, dán (Ctrl+V), hoặc
      <label style="color:var(--brand);cursor:pointer">chọn file<input id="file" type="file" accept="image/*" multiple hidden></label>
    </div>

    <details>
      <summary>Dán link ảnh (mỗi dòng 1 link)</summary>
      <textarea id="urls" rows="3" placeholder="https://image.crisp.chat/..."></textarea>
      <button id="btnUrls" style="margin-top:6px">Thêm link</button>
    </details>

    <div id="err" class="summary bad" hidden></div>
    <div id="summary" class="summary" hidden></div>
    <table>
      <thead><tr><th></th><th>Tên</th><th>Kích thước</th><th>Kết quả</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </section>

  <section id="tab-txt" hidden>
    <label><b>App name</b> (tối đa 30 ký tự)</label>
    <input type="text" id="appName" placeholder="Nhập tên app...">
    <div class="counter" id="nameCounter"></div>
    <label><b>Văn bản bất kỳ</b></label>
    <textarea id="anyText" rows="5" placeholder="Dán nội dung cần đếm ký tự..."></textarea>
    <div class="counter muted" id="textCounter"></div>
  </section>
</div>

<script>
const IOS_SIZES = [[2556,1179],[1179,2556],[2622,1206],[1206,2622]];
const RULES = {
  logo:    { label:"App logo",        test:(w,h)=> w===h && w>=512, hint:"vuông, ≥512×512" },
  ios:     { label:"iOS screenshot",  test:(w,h)=> IOS_SIZES.some(s=>s[0]===w&&s[1]===h), hint:"2556×1179 / 1179×2556 / 2622×1206 / 1206×2622", group:[2,8] },
  feature: { label:"Feature graphic", test:(w,h)=> w===1024 && h===500, hint:"1024×500" },
  phone:   { label:"Android phone",   test:(w,h)=> w===1080 && h===1920, hint:"1080×1920", group:[2,8] },
};
const items = []; // {id,name,src,blob|null,w,h}
let uid = 0;
const $ = (s)=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* Tabs / modal */
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("active",x===b));
  $("#tab-img").hidden = b.dataset.tab!=="img";
  $("#tab-txt").hidden = b.dataset.tab!=="txt";
});
$("#btnExpand").onclick = ()=>{
  const on = document.body.classList.toggle("expanded");
  $("#btnExpand").textContent = on ? "✕ Thu nhỏ" : "⤢ Mở rộng";
};
$("#btnPopout").onclick = ()=> window.open(location.href, "spec-checker", "width=1100,height=800");

/* Đo kích thước: Image() không bị chặn CORS nên link từ xa vẫn đo được */
function measure(src){
  return new Promise((res,rej)=>{
    const img = new Image();
    img.onload = ()=>res({w:img.naturalWidth,h:img.naturalHeight});
    img.onerror = ()=>rej(new Error("load fail"));
    img.src = src;
  });
}
function showErr(msg){ const el=$("#err"); el.hidden=false; el.textContent="⚠ "+msg; }
// Đọc ảnh KHÔNG dùng blob URL (iframe có thể chặn): ưu tiên createImageBitmap, dự phòng FileReader + dataURL
async function bitmapOf(blob){
  if (window.createImageBitmap) { try { return await createImageBitmap(blob); } catch(e){} }
  const dataUrl = await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(new Error("FileReader lỗi")); r.readAsDataURL(blob); });
  return await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=()=>rej(new Error("định dạng ảnh không đọc được")); i.src=dataUrl; });
}
async function addBlob(blob,name){
  try {
    const bmp = await bitmapOf(blob);
    const w = bmp.naturalWidth || bmp.width, h = bmp.naturalHeight || bmp.height;
    // Thumbnail vẽ bằng canvas → không phụ thuộc img-src
    const c = document.createElement("canvas"); c.width = c.height = 72; c.className = "th";
    const s = Math.max(72/w, 72/h), dw = w*s, dh = h*s;
    c.getContext("2d").drawImage(bmp, (72-dw)/2, (72-dh)/2, dw, dh);
    items.push({id:++uid,name,src:null,thumb:c,blob,w,h});
  } catch(e) { showErr(`Không đọc được "${name}": ${e.message}`); }
}
async function addUrl(url){
  url = url.trim();
  if (!/^https?:\/\//i.test(url) || items.some(i=>i.src===url)) return;
  const name = decodeURIComponent((url.split("?")[0].split("/").pop()) || "image") || "image";
  try {
    const {w,h} = await measure(url);
    let blob = null;
    try { const r = await fetch(url); if (r.ok) blob = await r.blob(); } catch {} // có thể bị CORS chặn → blob=null
    items.push({id:++uid,name,src:url,blob,w,h});
  } catch {}
}
async function addFiles(files){
  files = [...files];
  $("#err").hidden = true;
  if (!files.length) return showErr("Không nhận được file nào.");
  for (const f of files) await addBlob(f, f.name || "pasted-image.png");
  render();
}
$("#file").onchange = async e=>{ const fs=[...e.target.files]; e.target.value=""; await addFiles(fs); };

/* Kéo thả (file hoặc ảnh kéo từ trang khác → lấy URL) */
const drop = $("#drop");
["dragover","dragenter"].forEach(ev=>document.addEventListener(ev,e=>{e.preventDefault();drop.classList.add("over")}));
["dragleave"].forEach(ev=>document.addEventListener(ev,e=>{drop.classList.remove("over")}));
document.addEventListener("drop", async e=>{
  e.preventDefault(); drop.classList.remove("over");
  const dt = e.dataTransfer;
  if (dt.files && dt.files.length) return addFiles(dt.files);
  const urls = new Set();
  (dt.getData("text/uri-list")||"").split("\n").forEach(u=>u&&!u.startsWith("#")&&urls.add(u));
  const m = (dt.getData("text/html")||"").match(/<img[^>]+src=["']([^"']+)["']/i);
  if (m) urls.add(m[1]);
  for (const u of urls) await addUrl(u);
  render();
});
document.addEventListener("paste", async e=>{
  if (e.clipboardData.files.length) return addFiles([...e.clipboardData.files]);
});
$("#btnUrls").onclick = async ()=>{
  for (const u of $("#urls").value.split(/\s+/)) await addUrl(u);
  $("#urls").value = ""; render();
};

/* Tải tất cả */
function download(blob,name){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name; a.click();
}
$("#btnZip").onclick = async ()=>{
  if (!items.length) return;
  const zip = new JSZip(), used = {}, failed = [];
  items.forEach(it=>{
    if (!it.blob) return failed.push(it);
    let n = it.name; used[n] = (used[n]||0)+1;
    if (used[n]>1) n = n.replace(/(\.\w+)?$/, `_${used[n]}$1`);
    zip.file(n, it.blob);
  });
  if (Object.keys(used).length) download(await zip.generateAsync({type:"blob"}), "chat-images.zip");
  if (failed.length && confirm(`${failed.length} ảnh bị trình duyệt chặn tải tự động (CORS). Mở từng ảnh ở tab mới để lưu thủ công?`)) {
    failed.forEach(it=>window.open(it.src,"_blank"));
  }
};
$("#btnClear").onclick = ()=>{ items.length=0; render(); };
$("#mode").onchange = render;

/* Đánh giá */
function evaluate(it, mode){
  if (mode==="auto") {
    const m = Object.keys(RULES).filter(k=>RULES[k].test(it.w,it.h));
    return { ok:m.length>0, text:m.length? m.map(k=>RULES[k].label).join(", ") : "Không khớp spec nào" };
  }
  const ok = RULES[mode].test(it.w,it.h);
  return { ok, text: ok ? "Đạt" : "Cần: "+RULES[mode].hint };
}
function render(){
  const mode = $("#mode").value, tb = $("#rows");
  tb.innerHTML = ""; let pass = 0;
  items.forEach(it=>{
    const r = evaluate(it, mode); if (r.ok) pass++;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="tdimg"></td>
      <td>${esc(it.name)}</td><td><b>${it.w}×${it.h}</b></td>
      <td class="${r.ok?"ok":"bad"}">${r.ok?"✔":"✖"} ${esc(r.text)}</td>
      <td><button>✕</button></td>`;
    const cell = tr.querySelector(".tdimg");
    if (it.thumb) { cell.appendChild(it.thumb); }
    else { const im = new Image(); im.className = "th"; im.src = it.src; cell.appendChild(im); }
    tr.querySelector("button").onclick = ()=>{ items.splice(items.findIndex(x=>x.id===it.id),1); render(); };
    tb.appendChild(tr);
  });
  const s = $("#summary"); s.hidden = !items.length;
  let msg = `${pass}/${items.length} ảnh đạt`;
  const g = mode!=="auto" && RULES[mode].group;
  if (g) msg += pass>=g[0] && pass<=g[1] ? ` — ✔ số lượng hợp lệ (${g[0]}–${g[1]} ảnh)` : ` — ✖ cần ${g[0]}–${g[1]} ảnh đạt`;
  s.textContent = msg;
}

/* Ký tự */
const count = s=>[...s].length;
$("#appName").oninput = e=>{
  const n = count(e.target.value);
  $("#nameCounter").innerHTML = `<span class="${n<=30?"ok":"bad"}">${n}/30 ký tự ${n<=30?"✔":"✖ vượt "+(n-30)}</span>`;
};
$("#anyText").oninput = e=>{
  const v = e.target.value;
  $("#textCounter").textContent = `${count(v)} ký tự • ${count(v.replace(/\s/g,""))} không tính khoảng trắng • ${v.trim()?v.trim().split(/\s+/).length:0} từ`;
};
$("#appName").dispatchEvent(new Event("input"));
</script>
</body>
</html>
